<div class="backdrop" (click)="close.emit()">
  <div class="dialog" (click)="$event.stopPropagation()">
    <header class="head">
      <h3>{{ heading() }}</h3>
      <button class="x" type="button" aria-label="Close" (click)="close.emit()">×</button>
    </header>
    <div class="body">
      <ng-content />
    </div>
  </div>
</div>
